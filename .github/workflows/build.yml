name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: mvn clean package
      - uses: actions/upload-artifact@v7
        with:
          name: linuxifymc-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 90
